name: Build & Release Vify (All Platforms)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ui/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('ui/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: |
          cd ui
          flutter pub get

      - name: Build Universal & Split APKs
        run: |
          cd ui
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Collect Android APKs
        run: |
          mkdir -p dist/android
          # Universal APK
          if [ -f ui/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp ui/build/app/outputs/flutter-apk/app-release.apk dist/android/vify-android-universal.apk
          fi
          # Split APKs (arm64-v8a, armeabi-v7a, x86_64)
          for apk in ui/build/app/outputs/flutter-apk/app-*-release.apk; do
            filename=$(basename "$apk")
            if [ "$filename" != "app-release.apk" ]; then
              abi=$(echo "$filename" | sed 's/app-//' | sed 's/-release.apk//')
              cp "$apk" "dist/android/vify-android-${abi}.apk"
            fi
          done
          ls -lh dist/android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vify-android
          path: dist/android/*.apk

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Go CLI & Daemon
        run: |
          mkdir -p bin
          go build -ldflags "-s -w -X 'github.com/Mr-Meshky/vify-cli/cmd.version=${{ github.ref_name }}'" -o bin/vify .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ui/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('ui/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Build Flutter macOS Release
        run: |
          cd ui
          flutter pub get
          flutter build macos --release

      - name: Package macOS DMG & ZIP
        run: |
          mkdir -p dist
          RELEASE_DIR="$GITHUB_WORKSPACE/ui/build/macos/Build/Products/Release"
          
          # Ensure AppIcon.icns with full resolution is present in the app bundle
          if [ -f "$GITHUB_WORKSPACE/ui/macos/Runner/AppIcon.icns" ]; then
            cp "$GITHUB_WORKSPACE/ui/macos/Runner/AppIcon.icns" "$RELEASE_DIR/Vify.app/Contents/Resources/AppIcon.icns"
          fi

          # Embed CLI binary inside Vify.app bundle as well as release dir
          cp "$GITHUB_WORKSPACE/bin/vify" "$RELEASE_DIR/Vify.app/Contents/MacOS/vify"
          chmod +x "$RELEASE_DIR/Vify.app/Contents/MacOS/vify"
          cp "$GITHUB_WORKSPACE/bin/vify" "$RELEASE_DIR/"
          
          # Create ZIP archive
          cd "$RELEASE_DIR"
          zip -r -9 "$GITHUB_WORKSPACE/dist/vify-macos-universal.zip" Vify.app vify
          cp "$GITHUB_WORKSPACE/bin/vify" "$GITHUB_WORKSPACE/dist/vify-cli-darwin-universal"
          
          # Install create-dmg
          brew install create-dmg || true

          # Create DMG
          create-dmg \
            --volname "Vify Installer" \
            --volicon "$RELEASE_DIR/Vify.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 190 \
            --hide-extension "Vify.app" \
            "$GITHUB_WORKSPACE/dist/vify-macos-universal.dmg" \
            "$RELEASE_DIR/Vify.app" || true

          if [ ! -f "$GITHUB_WORKSPACE/dist/vify-macos-universal.dmg" ]; then
            echo "Fallback to hdiutil..."
            hdiutil create -volname "Vify" -srcfolder "$RELEASE_DIR/Vify.app" -ov -format UDZO "$GITHUB_WORKSPACE/dist/vify-macos-universal.dmg"
          fi
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vify-macos
          path: |
            dist/vify-macos-universal.dmg
            dist/vify-macos-universal.zip
            dist/vify-cli-darwin-universal

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Go Windows Binary
        run: |
          New-Item -ItemType Directory -Force -Path bin
          go build -ldflags "-s -w -X 'github.com/Mr-Meshky/vify-cli/cmd.version=${{ github.ref_name }}'" -o bin/vify.exe .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\Pub\Cache
            ui\.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('ui/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Build Flutter Windows Release
        shell: pwsh
        run: |
          cd ui
          flutter pub get
          # Create native_assets directory to avoid CMake INSTALL error
          New-Item -ItemType Directory -Force -Path "build\native_assets\windows" | Out-Null
          flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Package Windows Installer (.exe) & ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path ui/build/windows/x64/runner/Release/bin | Out-Null
          Copy-Item bin/vify.exe -Destination ui/build/windows/x64/runner/Release/bin/
          Copy-Item bin/vify.exe -Destination ui/build/windows/x64/runner/Release/vify-cli.exe
          # Create ZIP archive
          Compress-Archive -Path ui/build/windows/x64/runner/Release/* -DestinationPath dist/vify-windows-x64.zip
          # Compile Inno Setup Installer (.exe)
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrEmpty($version) -or $version -eq "main") { $version = "1.2.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version packaging/windows/installer.iss
          Get-ChildItem dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vify-windows
          path: |
            dist/vify-windows-x64.zip
            dist/vify-windows-x64-setup.exe

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Go Linux Binary
        run: |
          mkdir -p bin
          go build -ldflags "-s -w -X 'github.com/Mr-Meshky/vify-cli/cmd.version=${{ github.ref_name }}'" -o bin/vify .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ui/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('ui/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Build Flutter Linux Release
        run: |
          cd ui
          flutter pub get
          # Create native_assets directory to avoid CMake INSTALL error
          mkdir -p build/native_assets/linux
          flutter build linux --release

      - name: Package Linux DEB & Bundle
        run: |
          mkdir -p dist
          cp bin/vify ui/build/linux/x64/release/bundle/
          tar -czvf dist/vify-linux-x64.tar.gz -C ui/build/linux/x64/release/bundle/ .
          cp bin/vify dist/vify-cli-linux-amd64

          # Build Debian/Ubuntu package (.deb)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.2.0"; fi

          PKG_DIR="dist/deb-pkg"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/opt/vify"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/pixmaps"

          cp -r ui/build/linux/x64/release/bundle/* "$PKG_DIR/opt/vify/"
          ln -sf /opt/vify/vify-ui "$PKG_DIR/usr/bin/vify-ui"
          ln -sf /opt/vify/vify "$PKG_DIR/usr/bin/vify"

          if [ -f ui/assets/app_icon.png ]; then
            cp ui/assets/app_icon.png "$PKG_DIR/usr/share/pixmaps/vify.png"
          fi

          # Generate .desktop launcher file
          printf "[Desktop Entry]\nName=Vify\nComment=High-performance V2Ray and Sing-box GUI Client\nExec=/opt/vify/vify-ui\nIcon=vify\nTerminal=false\nType=Application\nCategories=Network;VPN;Utility;\nKeywords=vpn;proxy;v2ray;singbox;\n" > "$PKG_DIR/usr/share/applications/vify.desktop"

          # Generate Debian control file
          printf "Package: vify\nVersion: %s\nSection: net\nPriority: optional\nArchitecture: amd64\nMaintainer: Mr-Meshky <info@vify.org>\nDescription: High-performance V2Ray and Sing-box GUI Client\n Vify is a modern proxy and VPN desktop client with TUN routing and node management.\n" "$VERSION" > "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist/vify-linux-amd64.deb"
          rm -rf "$PKG_DIR"
          ls -lh dist/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vify-linux
          path: |
            dist/vify-linux-x64.tar.gz
            dist/vify-linux-amd64.deb
            dist/vify-cli-linux-amd64

  release:
    name: Create Multiplatform GitHub Release
    needs: [build-android, build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Organize Release Files
        run: |
          mkdir -p release-assets
          # Android APKs
          cp dist/vify-android/*.apk release-assets/ 2>/dev/null || true
          # macOS Installers & Archives
          cp dist/vify-macos/*.dmg release-assets/ 2>/dev/null || true
          cp dist/vify-macos/*.zip release-assets/ 2>/dev/null || true
          cp dist/vify-macos/vify-cli-darwin-universal release-assets/ 2>/dev/null || true
          # Windows Installer & Archives
          cp dist/vify-windows/*.exe release-assets/ 2>/dev/null || true
          cp dist/vify-windows/*.zip release-assets/ 2>/dev/null || true
          # Linux Installer & Archives
          cp dist/vify-linux/*.deb release-assets/ 2>/dev/null || true
          cp dist/vify-linux/*.tar.gz release-assets/ 2>/dev/null || true
          cp dist/vify-linux/vify-cli-linux-amd64 release-assets/ 2>/dev/null || true
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
